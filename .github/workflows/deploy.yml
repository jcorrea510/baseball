name: Check the game

# The live site is on Vercel, which rebuilds on every push to main but runs no checks of its own.
# This workflow is the safety net: on every push to main (and on demand) it runs the tests, builds the game and opens the
# finished site in a real browser (the smoke test). A red run means that push should not be trusted.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # Opens the finished site in the runner's Chrome, served under a sub-folder (the strictest case), clicks through the
      # menus and checks that every startup failure shows a readable message instead of hanging.
      - name: Smoke test the built game
        run: npm run smoke
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
